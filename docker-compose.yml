version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.openai.com/v1}
      CUBE_API_URL: ${CUBE_API_URL:-http://cube:4000}
      CUBE_API_TOKEN: ${CUBE_API_TOKEN:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      CHROMA_PATH: /data/chroma
    volumes:
      - ./backend:/app
      - chroma-data:/data/chroma
    depends_on:
      - chroma
      - cube
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000"
    environment:
      CUBEJS_DEV_MODE: "true"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: metricmind
      POSTGRES_USER: metricmind
      POSTGRES_PASSWORD: metricmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  chroma-data:
  postgres-data:
